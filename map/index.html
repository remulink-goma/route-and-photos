const map = L.map('map');
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',{attribution:'地理院タイル',maxZoom:18}).addTo(map);
const latlngs = D.route.map(p=>[p[0],p[1]]);
L.polyline(latlngs,{color:'#ffffff',weight:10,opacity:.95}).addTo(map);
const line = L.polyline(latlngs,{color:'#e4572e',weight:5,opacity:1}).addTo(map);
map.fitBounds(line.getBounds().pad(0.08));
const dynZoom = Math.min(16, map.getZoom()+2);
const walker = L.circleMarker([D.route[0][0],D.route[0][1]],{radius:9,color:'#fff',weight:3,fillColor:'#e4572e',fillOpacity:1}).addTo(map);
let followOn = false, panBusy = false, lastFollow = 0;
function followWalker(ll){
  if(!followOn) return;
  const now = performance.now(); if(now-lastFollow<120) return;
  const size = map.getSize(); if(!size.x || !size.y) return;
  const pt = map.latLngToContainerPoint(ll);
  if(map.getZoom() >= dynZoom){
    const dx = pt.x - size.x/2, dy = pt.y - size.y/2;
    if((Math.abs(dx)>3 || Math.abs(dy)>3) && !panBusy){
      lastFollow = now; panBusy = true;
      map.panBy([Math.round(dx), Math.round(dy)], {animate:true, duration:.15});
      map.once('moveend', ()=>{ panBusy = false; });
      setTimeout(()=>{ panBusy = false; }, 220);
    }
    return;
  }
  if(panBusy || now-lastFollow<250) return;
  const ix = size.x*0.15, iy = size.y*0.15;
  let dx = 0, dy = 0;
  if(pt.x<ix) dx = pt.x-ix; else if(pt.x>size.x-ix) dx = pt.x-(size.x-ix);
  if(pt.y<iy) dy = pt.y-iy; else if(pt.y>size.y-iy) dy = pt.y-(size.y-iy);
  if(!dx && !dy) return;
  const b = line.getBounds();
  const nw = map.latLngToContainerPoint(b.getNorthWest()), se = map.latLngToContainerPoint(b.getSouthEast());
  if(nw.x>=-1 && se.x<=size.x+1){ if(dx<0 && se.x-dx>size.x) dx = 0; if(dx>0 && nw.x-dx<0) dx = 0; }
  if(nw.y>=-1 && se.y<=size.y+1){ if(dy<0 && se.y-dy>size.y) dy = 0; if(dy>0 && nw.y-dy<0) dy = 0; }
  if(!dx && !dy) return;
  lastFollow = now; panBusy = true;
  map.panBy([Math.round(dx), Math.round(dy)], {animate:true, duration:.35});
  map.once('moveend', ()=>{ panBusy = false; });
  setTimeout(()=>{ panBusy = false; }, 500);
}
window.addEventListener('resize', ()=>{ setTimeout(()=>{ map.invalidateSize(); }, 200); });
function jst(iso){const d=new Date(iso);return d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Tokyo'});}
function posAt(frac){
  const target = D.total_m*frac; const R=D.route;
  for(let i=1;i<R.length;i++){ if(R[i][2]>=target){ const a=R[i-1],b=R[i]; const t=(target-a[2])/Math.max(1,(b[2]-a[2])); return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, b[3]]; } }
  const last=R[R.length-1]; return [last[0],last[1],last[3]];
}
const scrub=document.getElementById('scrub'), readout=document.getElementById('readout');
function update(){ const f=scrub.value/1000; const p=posAt(f); walker.setLatLng([p[0],p[1]]); followWalker([p[0],p[1]]); readout.textContent=(D.total_m*f/1000).toFixed(1)+' km ・ '+jst(p[2]); }
scrub.addEventListener('input',()=>{ stop(); lastShown=-1; hideCard(); followOn=true; update(); }); update();
const photoFracs = D.photos.map(ph=>{
  let best=0, bd=1e18;
  D.route.forEach((p,i)=>{ const d=(p[0]-ph.pos[0])**2+(p[1]-ph.pos[1])**2; if(d<bd){bd=d;best=i;} });
  return D.route[best][2]/D.total_m;
});
const markers = [];
let lastShown = -1;
function syncHero(){
  const f = scrub.value/1000; let cur = -1;
  photoFracs.forEach((pf,i)=>{ if(f>=pf) cur=i; });
  if(cur>=0 && cur!==lastShown){ lastShown=cur; if(markers[cur]) markers[cur].show(); }
}
let playing=false, rafId=null, playStart=0, fromFrac=0;
const DURATION = 10000;
const playBtn = document.getElementById('play');
function stop(){ playing=false; if(rafId) cancelAnimationFrame(rafId); rafId=null; playBtn.textContent='▶ 散歩を再生（10秒）'; }
function tick(now){
  if(!playing) return;
  const f = fromFrac + (now-playStart)/DURATION;
  if(f>=1){ scrub.value=1000; update(); syncHero(); stop(); return; }
  scrub.value = Math.round(f*1000); update(); syncHero();
  rafId = requestAnimationFrame(tick);
}
playBtn.onclick = ()=>{
  if(playing){ stop(); return; }
  if(scrub.value>=1000) scrub.value=0;
  fromFrac = scrub.value/1000; playStart = performance.now();
  playing = true; followOn = true; playBtn.textContent = '⏸ 一時停止';
  const wp0 = posAt(scrub.value/1000); panBusy = true; map.flyTo([wp0[0], wp0[1]], dynZoom, {duration:.6}); map.once('moveend', ()=>{ panBusy = false; }); setTimeout(()=>{ panBusy = false; }, 750);
  rafId = requestAnimationFrame(tick);
};
const card = document.createElement('div'); card.id='photoCard'; document.getElementById('map').appendChild(card);
function hideCard(){ card.style.display='none'; card._pos=null; }
function showCard(mk){
  card.innerHTML = mk.html; card.style.display='block';
  const img = card.querySelector('img'); if(img) img.title='タッチで全画面';
  const size = map.getSize(), cw = card.offsetWidth, ch = card.offsetHeight, pad = 10;
  const pts = [];
  for(let i=0;i<D.route.length;i+=8){ pts.push(map.latLngToContainerPoint([D.route[i][0], D.route[i][1]])); }
  const anchor = map.latLngToContainerPoint(mk.latlng);
  const cand = [
    [pad,pad],[size.x-cw-pad,pad],[pad,size.y-ch-pad],[size.x-cw-pad,size.y-ch-pad],
    [Math.round((size.x-cw)/2),pad],[Math.round((size.x-cw)/2),size.y-ch-pad],
    [pad,Math.round((size.y-ch)/2)],[size.x-cw-pad,Math.round((size.y-ch)/2)]
  ];
  const scored = cand.map(c=>{
    let score = 0;
    pts.forEach(p=>{ if(p.x>=c[0]-6 && p.x<=c[0]+cw+6 && p.y>=c[1]-6 && p.y<=c[1]+ch+6) score++; });
    if(anchor.x>=c[0]-14 && anchor.x<=c[0]+cw+14 && anchor.y>=c[1]-14 && anchor.y<=c[1]+ch+14) score += 1000;
    const anchorDist = Math.hypot(c[0]+cw/2-anchor.x, c[1]+ch/2-anchor.y);
    return {c, score, anchorDist};
  });
  const sorted = scored.slice().sort((a,b)=> a.score-b.score || b.anchorDist-a.anchorDist);
  const pool = sorted.slice(0, Math.min(3, sorted.length));
  const prev = card._pos || null;
  let chosen = null;
  if(prev){
    let bestMove = -1;
    pool.forEach(s=>{
      const move = Math.hypot(s.c[0]-prev[0], s.c[1]-prev[1]);
      const value = move - s.score*1.5 + s.anchorDist*0.05;
      if(move>40 && value>bestMove){ bestMove=value; chosen=s; }
    });
  }
  if(!chosen){ chosen = pool.slice().sort((a,b)=> a.score-b.score || b.anchorDist-a.anchorDist)[0]; }
  const best = chosen.c; card._pos = best;
  card.style.left = best[0]+'px'; card.style.top = best[1]+'px';
}
document.addEventListener('click', e=>{
  const t=e.target;
  if(t && t.tagName==='IMG' && t.closest && t.closest('.pop')){
    stop();
    const lb=document.getElementById('lightbox'), lbImg=document.getElementById('lb-img');
    if(lb&&lbImg){ lbImg.src=t.src; lb.style.display='flex'; lb.onclick=()=>{ lb.style.display='none'; }; }
  }
});
D.photos.forEach((ph,i)=>{
  markers.push({latlng:[ph.pos[0],ph.pos[1]], html:'<div class="pop"><img src="'+ph.img+'"><p>'+ph.cap+'</p></div>', show:function(){ showCard(this); }});
});
D.photos.forEach(ph=>{ const pi=new Image(); pi.src=ph.img; });
