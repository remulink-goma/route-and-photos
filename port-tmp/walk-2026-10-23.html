function syncHero(){
  const f = scrub.value/1000; let cur = -1;
  photoFracs.forEach((pf,i)=>{ if(f>=pf) cur=i; });
  if(cur>=0 && cur!==lastShown){ lastShown=cur; if(markers[cur]) markers[cur].show(); }
}
let playing=false, rafId=null, playStart=0, fromFrac=0;
const DURATION = 10000;
const playBtn = document.getElementById('play');
function stop(){ playing=false; if(rafId) cancelAnimationFrame(rafId); rafId=null; playBtn.textContent='▶ 散歩を再生（10秒）'; }
function tick(now){
  if(!playing) return;
  const f = fromFrac + (now-playStart)/DURATION;
  if(f>=1){ scrub.value=1000; update(); syncHero(); stop(); return; }
  scrub.value = Math.round(f*1000); update(); syncHero();
  rafId = requestAnimationFrame(tick);
}
playBtn.onclick = ()=>{
  if(playing){ stop(); return; }
  if(scrub.value>=1000) scrub.value=0;
  fromFrac = scrub.value/1000; playStart = performance.now();
  playing = true; followOn = true; playBtn.textContent = '⏸ 一時停止';
  const wp0 = posAt(scrub.value/1000); panBusy = true; map.flyTo([wp0[0], wp0[1]], dynZoom, {duration:.6}); map.once('moveend', ()=>{ panBusy = false; }); setTimeout(()=>{ panBusy = false; }, 750);
  rafId = requestAnimationFrame(tick);
};
const card = document.createElement('div'); card.id='photoCard'; document.getElementById('map').appendChild(card);
function hideCard(){ card.style.display='none'; card._pos=null; }
function showCard(mk){
  card.innerHTML = mk.html; card.style.display='block';
  const img = card.querySelector('img'); if(img){ img.title='タッチで全画面'; img.onclick=()=>{ stop(); const lb=document.getElementById('lightbox'), lbImg=document.getElementById('lb-img'); if(lb&&lbImg){ lbImg.src=img.src; lb.style.display='flex'; lb.onclick=()=>{ lb.style.display='none'; }; } }; }
  const size = map.getSize(), cw = card.offsetWidth, ch = card.offsetHeight, pad = 10;
  const pts = [];
  for(let i=0;i<D.route.length;i+=8){ pts.push(map.latLngToContainerPoint([D.route[i][0], D.route[i][1]])); }
  const anchor = map.latLngToContainerPoint(mk.latlng);
  const cand = [
    [pad,pad],[size.x-cw-pad,pad],[pad,size.y-ch-pad],[size.x-cw-pad,size.y-ch-pad],
    [Math.round((size.x-cw)/2),pad],[Math.round((size.x-cw)/2),size.y-ch-pad],
    [pad,Math.round((size.y-ch)/2)],[size.x-cw-pad,Math.round((size.y-ch)/2)]
  ];
  const scored = cand.map(c=>{
    let score = 0;
    pts.forEach(p=>{ if(p.x>=c[0]-6 && p.x<=c[0]+cw+6 && p.y>=c[1]-6 && p.y<=c[1]+ch+6) score++; });
    if(anchor.x>=c[0]-14 && anchor.x<=c[0]+cw+14 && anchor.y>=c[1]-14 && anchor.y<=c[1]+ch+14) score += 1000;
    const anchorDist = Math.hypot(c[0]+cw/2-anchor.x, c[1]+ch/2-anchor.y);
    return {c, score, anchorDist};
  });
  const sorted = scored.slice().sort((a,b)=> a.score-b.score || b.anchorDist-a.anchorDist);
  const pool = sorted.slice(0, Math.min(3, sorted.length));
  const prev = card._pos || null;
  let chosen = null;
  if(prev){
    let bestMove = -1;
    pool.forEach(s=>{
      const move = Math.hypot(s.c[0]-prev[0], s.c[1]-prev[1]);
      const value = move - s.score*1.5 + s.anchorDist*0.05;
      if(move>40 && value>bestMove){ bestMove=value; chosen=s; }
    });
  }
  if(!chosen){ chosen = pool.slice().sort((a,b)=> a.score-b.score || b.anchorDist-a.anchorDist)[0]; }
  const best = chosen.c; card._pos = best;
  card.style.left = best[0]+'px'; card.style.top = best[1]+'px';
}
D.photos.forEach((ph,i)=>{
  markers.push({latlng:[ph.pos[0],ph.pos[1]], html:'<div class="pop"><img src="'+ph.img+'"><p>'+ph.cap+'</p></div>', show:function(){ showCard(this); }});
});
D.photos.forEach(ph=>{ const pi=new Image(); pi.src=ph.img; });
