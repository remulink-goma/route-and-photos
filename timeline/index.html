<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アルバム年表｜レムリンク</title><style>
body{font-family:sans-serif;margin:0 auto;padding:10px;color:#222;background:#fff;max-width:680px}
h1{font-size:20px;margin:4px 0 2px}
.note{font-size:13px;color:#555;margin:2px 0 8px}
#stage{position:relative;height:352px;background:#faf7f2;border:1px solid #e3ddd2;border-radius:8px;overflow:hidden;touch-action:pan-y;cursor:grab}
#yearBig{position:absolute;top:8px;left:12px;font-size:30px;font-weight:bold;color:#e4572e;opacity:.9}
#card{position:absolute;bottom:74px;width:196px;margin-left:-98px;text-align:center;transition:opacity .15s}
#card img{width:172px;height:172px;border-radius:6px;box-shadow:0 2px 10px rgba(0,0,0,.25);display:block;margin:0 auto;background:#eee}
#card .cap{margin-top:6px;font-size:13px;line-height:1.35}
#card .cap b{font-size:13px}
#axis{position:absolute;left:14px;right:14px;bottom:44px;height:2px;background:#c9c2b4}
.tick{position:absolute;top:-4px;width:2px;height:10px;background:#a89f8c}
.tick span{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#777}
#ptr{position:absolute;bottom:38px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#e4572e;border:2px solid #fff;box-shadow:0 0 0 2px #e4572e}
#guide{position:absolute;bottom:52px;width:2px;margin-left:-1px;background:rgba(228,87,46,.35);height:250px}
#lightbox{position:fixed;inset:0;height:100vh;height:100dvh;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;z-index:3000;cursor:pointer;padding:14px;box-sizing:border-box}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;display:block}
#playBtn{display:block;width:100%;margin-top:10px;padding:16px 0;font-size:19px;font-weight:bold;color:#fff;background:#e4572e;border:none;border-radius:8px;cursor:pointer}
</style></head>
<body>
<h1>アルバム年表（ルートと写真システム）</h1><p class="note">レムリンクの配信アルバムを、発売順にたどります。</p>
<div id="stage">
  <div id="yearBig"></div>
  <div id="card"><img id="cimg" alt=""><div class="cap" id="ccap"></div></div>
  <div id="guide"></div><div id="axis"></div><div id="ptr"></div>
</div>
<button id="playBtn">▶ 年表を再生（約27秒）</button>
<p class="note">2016年の配信開始から、ベスト盤まで全26作。ジャケットをタッチすると大きく表示されます。※「ルートと写真」システムは<a href="https://github.com/remulink-goma/route-and-photos" target="_top">GitHubで配布中です</a>。</p>
<script>
const A = [{"d": "2016-12-07", "t": "輝いていてよ 2016 Selection 1", "img": "jackets/a01.jpg"}, {"d": "2016-12-07", "t": "いつでも君は素敵 2016 Selection 2", "img": "jackets/a02.jpg"}, {"d": "2016-12-18", "t": "君は素敵な幻さ 2016 Original 31", "img": "jackets/a03.jpg"}, {"d": "2017-05-08", "t": "しまわれた絵の具 2016 Original 29", "img": "jackets/a04.jpg"}, {"d": "2017-09-25", "t": "恋する夏 2017 Original 33", "img": "jackets/a05.jpg"}, {"d": "2017-10-25", "t": "ホタルの夜 2016 Original 30", "img": "jackets/a06.jpg"}, {"d": "2018-01-04", "t": "チャッチャッチャ 2017 Original 34", "img": "jackets/a07.jpg"}, {"d": "2018-01-04", "t": "にゃんころ先生の瞳 2017 Original 32", "img": "jackets/a08.jpg"}, {"d": "2018-07-04", "t": "花をわたす 2018 Original 35", "img": "jackets/a09.jpg"}, {"d": "2018-10-23", "t": "大空の上 2018 Selection 3", "img": "jackets/a10.jpg"}, {"d": "2019-01-08", "t": "シンデレラと恋 2018 Original 36", "img": "jackets/a11.jpg"}, {"d": "2019-05-29", "t": "太陽の踊り 2019 Selection 4", "img": "jackets/a12.jpg"}, {"d": "2019-07-14", "t": "生きて死ぬだけ 2019 Original 37", "img": "jackets/a13.jpg"}, {"d": "2019-08-07", "t": "君はウエイトレス 2019 Selection 5", "img": "jackets/a14.jpg"}, {"d": "2019-09-17", "t": "オレンジの花 2019 Selection 6", "img": "jackets/a15.jpg"}, {"d": "2019-12-24", "t": "なんにもない夜 2019 Selection 7", "img": "jackets/a16.jpg"}, {"d": "2020-01-11", "t": "ああ、空が青い 2019 Original 38", "img": "jackets/a17.jpg"}, {"d": "2020-01-30", "t": "メン アンド アルコール 2020 Selection 8", "img": "jackets/a18.jpg"}, {"d": "2020-06-26", "t": "No Reply 2020 Selection 9", "img": "jackets/a19.jpg"}, {"d": "2020-07-01", "t": "朝顔が咲く 2020 Original 39", "img": "jackets/a20.jpg"}, {"d": "2021-01-08", "t": "誰にもわかる夢 2020 Original 40", "img": "jackets/a21.jpg"}, {"d": "2021-04-23", "t": "放り出してる 2021 Selection 10", "img": "jackets/a22.jpg"}, {"d": "2022-07-18", "t": "良き日々を 2022 Original 41 (Ver2)", "img": "jackets/a23.jpg"}, {"d": "2022-10-01", "t": "NEW BEST レムリンク", "img": "jackets/a25.jpg"}, {"d": "2022-10-28", "t": "BEST2 今、生きてるかい", "img": "jackets/a24.jpg"}, {"d": "2025-04-14", "t": "BEST3 ふつうのうた レムリンク", "img": "jackets/a26.jpg"}];
const stage = document.getElementById('stage'), card = document.getElementById('card'),
      cimg = document.getElementById('cimg'), ccap = document.getElementById('ccap'),
      ptr = document.getElementById('ptr'), guide = document.getElementById('guide'),
      axis = document.getElementById('axis'), yb = document.getElementById('yearBig'),
      btn = document.getElementById('playBtn');
A.forEach(a=>{ const i=new Image(); i.src=a.img; });
const t0 = new Date(A[0].d).getTime(), t1 = new Date(A[A.length-1].d).getTime();
const TRAVEL = 13000, PAUSE = 550;
let W = 0, stops = [];
function layout(){
  W = stage.clientWidth;
  const pad = 24, x0 = pad, x1 = W - pad;
  axis.style.left = x0+'px'; axis.style.right = (W-x1)+'px';
  stops = A.map(a=>({ a, x: x0 + (new Date(a.d).getTime()-t0)/(t1-t0)*(x1-x0), shown:false }));
  for(let y=2017; y<=2025; y++){
    const tx = x0 + (new Date(y+'-01-01').getTime()-t0)/(t1-t0)*(x1-x0);
    if(tx > x0+16 && tx < x1-16 && !document.querySelector('.tick[data-y="'+y+'"]')){
      const t = document.createElement('div'); t.className='tick'; t.dataset.y=y; t.style.left=tx+'px';
      t.innerHTML = '<span>'+y+'</span>'; stage.appendChild(t);
    }
  }
  move(x0); show(A[0]);
}
function move(x){ ptr.style.left = x+'px'; guide.style.left = x+'px'; card.style.left = Math.max(102, Math.min(W-102, x))+'px'; }
function show(a){ cimg.src = a.img; ccap.innerHTML = '<b>'+a.d.slice(0,4)+'年</b>　'+a.t; yb.textContent = a.d.slice(0,4); }
let playing=false, raf=null, lastTs=0, pos=0, dwellUntil=0, nextStop=0;
// pos: position in "travel ms" 0..TRAVEL; dwell handled by wall-clock deadline
function frame(ts){
  if(!playing) return;
  if(!lastTs) lastTs = ts;
  const dt = ts - lastTs; lastTs = ts;
  if(ts < dwellUntil){ raf = requestAnimationFrame(frame); return; }
  pos += dt;
  const x = 24 + (pos/TRAVEL)*(W-48);
  move(Math.min(x, W-24));
  while(nextStop < stops.length && x >= stops[nextStop].x - 1){
    const s = stops[nextStop++];
    card.style.opacity = 0;
    setTimeout(()=>{ show(s.a); card.style.opacity = 1; }, 130);
    dwellUntil = ts + PAUSE;
  }
  if(pos >= TRAVEL){ stop(true); return; }
  raf = requestAnimationFrame(frame);
}
function stop(done){
  playing = false; if(raf) cancelAnimationFrame(raf); raf=null; lastTs=0;
  btn.textContent = done ? '▶ もう一度再生' : '▶ 年表を再生（約27秒）';
}
btn.onclick = ()=>{
  if(playing){ stop(false); return; }
  if(pos >= TRAVEL){ pos = 0; nextStop = 0; }
  playing = true; btn.textContent = '⏸ 一時停止'; lastTs = 0;
  raf = requestAnimationFrame(frame);
};
/* --- drag the pointer: scrub across the stage to choose an album --- */
let scrubbing = false;
function scrubTo(clientX){
  const r = stage.getBoundingClientRect();
  const x = Math.max(24, Math.min(W-24, clientX - r.left));
  let idx = 0, best = 1e9;
  stops.forEach((s,i)=>{ const d = Math.abs(s.x - x); if(d < best){ best = d; idx = i; } });
  pos = (stops[idx].x - 24)/(W-48)*TRAVEL; nextStop = idx + 1;
  move(stops[idx].x); show(stops[idx].a);
}
stage.addEventListener('pointerdown', (e)=>{
  if(e.target.closest('#card')) return;
  if(playing) stop(false);
  scrubbing = true;
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  scrubTo(e.clientX);
});
stage.addEventListener('pointermove', (e)=>{ if(scrubbing) scrubTo(e.clientX); });
stage.addEventListener('pointerup', ()=>{ scrubbing = false; });
stage.addEventListener('pointercancel', ()=>{ scrubbing = false; });
card.style.cursor='pointer';
card.onclick = ()=>{ if(playing) stop(false); const lb=document.getElementById('lightbox'); document.getElementById('lbImg').src=cimg.src; lb.style.display='flex'; };
window.addEventListener('resize', layout);
layout();
</script>
<div id="lightbox" onclick="this.style.display='none'"><img id="lbImg" alt=""></div>
</body></html>
